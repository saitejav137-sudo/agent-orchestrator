# Agent Orchestrator — self-hosting config (dog-fooding)

dataDir: ~/.ao-sessions
worktreeDir: ~/.worktrees/ao

cleanup:
  pruneBranches: true

defaults:
  runtime: tmux
  agent: opencode
  workspace: worktree
  notifiers: [desktop]

projects:
  ao:
    name: Agent Orchestrator
    repo: ComposioHQ/agent-orchestrator
    path: ~/Projects/agent-orchestrator
    defaultBranch: main
    sessionPrefix: ao
    orchestratorSessionStrategy: reuse
    scm:
      plugin: github
    tracker:
      plugin: linear
      teamId: "2a6e9b1b-19cd-4e30-b5bd-7b34dc491c7e"
    symlinks: [.claude]
    postCreate:
      - "pnpm install"
    agentConfig:
      permissions: skip
      model: zai-coding-plan/glm-5
      orchestratorModel: openai/gpt-5.3-codex
